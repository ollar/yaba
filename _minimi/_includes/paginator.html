<div class="pager">
  <ul class="pagination">
    {%- if include.paginator.previous_page %}
    <li>
      <a href="{{ include.paginator.previous_page_path | relative_url }}" class="previous-page" title="Go to Page {{ include.paginator.previous_page }}">
        {{ include.paginator.previous_page }}
      </a>
    </li>
    {%- endif %}
    <li><div class="current-page">{{ include.paginator.page }}</div></li>
    {%- if include.paginator.next_page %}
    <li>
      <a href="{{ include.paginator.next_page_path | relative_url }}" class="next-page" title="Go to Page {{ include.paginator.next_page }}">
        {{ include.paginator.next_page }}
      </a>
    </li>
    {%- endif %}
  </ul>
</div>
