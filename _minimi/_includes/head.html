<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  {% if page.description %}
  <meta name="description" content="{{page.description}}" />
  {% elsif site.description %}
  <meta name="description" content="{{site.description}}" />
  {% endif %}

  {% if page.meta.author %}
  <meta name="author" content="{{ site.author }}">
  {% endif %}

  {% if page and page.canonical_url %}<link rel="canonical" href="{{ page.canonical_url }}">{% endif %}
  <link rel="shortcut icon" href="{{ '/assets/favicon.ico'|url }}">

  <!-- <meta property="og:title" content="{{page.meta.social_tags_title}}" /> -->
  <!-- <meta property="og:description" content="{{page.meta.description}}" /> -->
  <!-- <meta property="og:url" content="{{page.canonical_url}}" /> -->
  <!-- <meta property="og:image" content="{{page.meta.social_tags_image}}" /> -->

  <title>{% unless page.layout == 'home' %}{{ page.title }} - {% endunless %}{{ site.site_name }}</title>

  <link rel="stylesheet" href="//writ.cmcenroe.me/1.0.4/writ.min.css">

  <link href="{{ '/assets/css/main.css'|relative_url }}" rel="stylesheet">

</head>
